name: Deploy Arquiteto de Operações

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Validate source
        run: npm test

      - name: Prepare public package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .deploy
          mkdir -p .deploy
          cp index.html privacy.html admin.html styleguide.html styles.css script.js config.js tokens.json .deploy/
          cp -R assets data .deploy/

      - name: Deploy to Hostinger subpath
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ftp.leonardobrasil.com.br
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: .deploy/
          server-dir: ./
          state-name: .ftp-deploy-sync-state.json
          security: strict
          log-level: minimal
